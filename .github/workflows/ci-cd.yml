name: CI/CD Wokelaa Tracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: matthewrivandy/wokelaa-tracker-app

jobs:
  # ---------- CI: cek kode + tes build image ----------
  ci:
    name: CI - Cek kode dan build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r app/requirements.txt

      - name: Cek sintaks Python
        run: python -m py_compile app/app.py

      - name: Tes build Docker image
        run: docker build -t $IMAGE:test ./app

  # ---------- CD 1: push image ke Docker Hub ----------
  push:
    name: CD - Push image ke Docker Hub
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ---------- CD 2: deploy image dari Docker Hub + smoke test ----------
  deploy:
    name: CD - Deploy container dan smoke test
    needs: push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buat file .env untuk deploy
        run: |
          cat > .env <<'ENVEOF'
          MYSQL_ROOT_PASSWORD=ci_root_pass
          MYSQL_DATABASE=wokelaa
          MYSQL_USER=wokelaa_user
          MYSQL_PASSWORD=ci_user_pass
          SECRET_KEY=ci_secret_key
          ENVEOF

      - name: Pull image terbaru dari Docker Hub
        run: docker compose pull app

      - name: Jalankan semua container
        run: docker compose up -d --no-build

      - name: Smoke test (tunggu app merespons)
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/tugas > /dev/null; then
              echo "App berjalan dengan baik"; exit 0
            fi
            echo "Menunggu app... ($i/30)"; sleep 5
          done
          docker compose logs
          exit 1

      - name: Status container
        if: always()
        run: docker compose ps
